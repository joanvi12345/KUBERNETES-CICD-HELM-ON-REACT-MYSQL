name: Secrets Management Demo

on:
  push:
    branches:
      - "**"

jobs:
  use-secret:
    name: Use API Key Secret
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 1. Validate the secret is configured ─────────────────────────────
      - name: Use API key securely
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          echo "API key loaded successfully"

          if [ -z "$API_KEY" ]; then
            echo "❌ API key is missing — add MY_API_KEY in Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ API key is available (length: ${#API_KEY} chars)"

      # ── 2. Mask the secret so it never leaks in logs ─────────────────────
      - name: Mask secret in all subsequent log output
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          # Add the value to the step mask list — GitHub will redact it
          echo "::add-mask::$API_KEY"
          echo "Secret is now masked for the rest of this job."

      # ── 3. Use the secret in a realistic scenario (API call) ─────────────
      - name: Simulate an authenticated API call
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
          API_ENDPOINT: "https://httpbin.org/headers"
        run: |
          echo "🌐 Sending authenticated request to $API_ENDPOINT..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $API_KEY" \
            -H "X-App-Name: react-express-mysql" \
            "$API_ENDPOINT")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "  HTTP Status : $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  ✅ Request succeeded"
          else
            echo "  ❌ Request failed with status $HTTP_STATUS"
            exit 1
          fi

      # ── 4. Show that secrets are automatically redacted in output ─────────
      - name: Demonstrate automatic secret redaction
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "================================================"
          echo "  🔒 Secret Redaction Demonstration"
          echo "================================================"
          echo "  If you try to echo a secret directly:"
          echo "  API_KEY value → $API_KEY"
          echo "  (GitHub Actions replaces the value with ***)"
          echo ""
          echo "  DOCKERHUB_TOKEN → $DOCKERHUB_TOKEN"
          echo "  (also redacted automatically)"
          echo "================================================"

      # ── 5. Pass secrets between steps safely via GITHUB_ENV ───────────────
      - name: Pass secret to next step via environment file
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          # Never use $GITHUB_ENV for secrets in production — this is for demo only.
          # Prefer passing secrets directly via 'env:' on each step.
          echo "DERIVED_VALUE=prefix-${API_KEY:0:4}****" >> $GITHUB_ENV
          echo "ℹ️  Derived (non-sensitive) value written to GITHUB_ENV"

      - name: Read derived value from previous step
        run: |
          echo "  Derived value (safe to log): $DERIVED_VALUE"

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Print secrets management summary
        run: |
          echo "================================================"
          echo "  📋 Secrets Management Summary"
          echo "================================================"
          echo "  ✅ Secret validated     (MY_API_KEY)"
          echo "  ✅ Secret masked        (::add-mask::)"
          echo "  ✅ API call simulated   (Authorization header)"
          echo "  ✅ Auto-redaction shown (GitHub built-in)"
          echo "  ✅ Safe value derived   (GITHUB_ENV)"
          echo ""
          echo "  Best practices applied:"
          echo "    • Secrets accessed via env: per-step, not globally"
          echo "    • Never printed raw — always redacted by GitHub"
          echo "    • ::add-mask:: used for dynamic derived secrets"
          echo "    • Secrets stored in Settings → Secrets → Actions"
          echo "================================================"
