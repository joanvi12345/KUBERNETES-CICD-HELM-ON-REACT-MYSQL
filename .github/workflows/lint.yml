name: Lint Code

on:
  push:
    branches:
      - "**"

jobs:
  lint-frontend:
    name: ESLint - Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --ext .js,.jsx --max-warnings=0
        env:
          CI: true

  lint-backend:
    name: ESLint - Backend (Node/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Prepara Node.js 18 y activa la caché de dependencias para acelerar el workflow
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # 2. Instala ESLint y sus reglas recomendadas para el backend
      - name: Install ESLint
        run: npm install --save-dev eslint@8 @eslint/js

      # 3. Crea la configuración de ESLint dinámicamente si no existe ningún archivo de reglas
      - name: Create ESLint config (if not present)
        run: |
          if [ ! -f ".eslintrc.json" ] && [ ! -f ".eslintrc.js" ] && [ ! -f "eslint.config.js" ]; then
            cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": 2021
            },
            "rules": {
              "no-unused-vars": "warn",
              "no-console": "off"
            }
          }
          EOF
          fi

      # 4. Ejecuta el linter en la carpeta src/: falla el pipeline si hay errores o warnings (--max-warnings=0)
      - name: Run ESLint
        run: npx eslint src/ --ext .js --max-warnings=0
        env:
          CI: true
