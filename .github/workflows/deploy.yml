name: Build & Deploy to GitHub Pages

on:
  workflow_call: # solo se ejecuta cuando main.yml lo llame

# Grant GITHUB_TOKEN the permissions needed to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling any in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          CI: false # Allows warnings without failing the build
          # Set the public URL so React Router works correctly on GitHub Pages
          # Replace 'KUBERNETES-CICD-HELM-ON-REACT-MYSQL' with your actual repo name
          PUBLIC_URL: /KUBERNETES-CICD-HELM-ON-REACT-MYSQL

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
