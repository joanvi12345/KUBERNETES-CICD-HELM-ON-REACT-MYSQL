name: Docker Build & Push to Docker Hub

on:
  push:
    branches:
      - main

    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/docker.yml"

env:
  # Replace with your Docker Hub username if different from GitHub owner
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-push-frontend:
    name: Build & Push Frontend Image (React + Nginx)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Generate image tags and labels automatically from repo metadata
      - name: Extract Docker metadata (tags & labels)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/react-express-mysql-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Set up QEMU for multi-platform builds (amd64 + arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the production stage (nginx serving the React build)
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          # Target the final nginx stage (production image)
          target: ""
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          # Cache layers in the GitHub Actions cache
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NODE_ENV=production

      - name: Print frontend image digest
        run: echo "Frontend image digest → ${{ steps.meta-frontend.outputs.version }}"

  build-push-backend:
    name: Build & Push Backend Image (Node/Express)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Docker metadata (tags & labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/react-express-mysql-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Target the production development stage (not dev-envs)
          target: development
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            NODE_ENV=production
            PORT=80

      - name: Print backend image digest
        run: echo "Backend image digest → ${{ steps.meta-backend.outputs.version }}"

  # Summary job — confirms both images were pushed successfully
  docker-summary:
    name: Docker Push Summary
    runs-on: ubuntu-latest
    needs: [build-push-frontend, build-push-backend]
    if: always()

    steps:
      - name: Report results
        run: |
          echo "================================================"
          echo "  🐳 Docker Hub Push Summary"
          echo "================================================"
          echo "  Frontend: ${{ needs.build-push-frontend.result }}"
          echo "  Backend : ${{ needs.build-push-backend.result }}"
          echo "------------------------------------------------"
          echo "  Images available at:"
          echo "  docker pull ${{ env.DOCKERHUB_USERNAME }}/react-express-mysql-frontend:latest"
          echo "  docker pull ${{ env.DOCKERHUB_USERNAME }}/react-express-mysql-backend:latest"
          echo "================================================"
          if [ "${{ needs.build-push-frontend.result }}" != "success" ] || \
             [ "${{ needs.build-push-backend.result }}" != "success" ]; then
            exit 1
          fi
