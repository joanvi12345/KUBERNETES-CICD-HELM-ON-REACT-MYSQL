name: Matrix Build - Frontend Node.js Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test-frontend:
    name: Frontend | Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        node-version: ["14.x", "16.x", "18.x", "20.x"]
        os: [ubuntu-latest, windows-latest]

        # Exclude combinations that are known to be incompatible
        exclude:
          - os: windows-latest
            node-version: "14.x"

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Display Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --watchAll=false --ci
        env:
          CI: true

  matrix-success:
    name: All Frontend Matrix Jobs Passed
    runs-on: ubuntu-latest
    needs: test-frontend
    if: always()

    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test-frontend.result }}" = "success" ]; then
            echo "✅ All frontend matrix jobs completed successfully."
          else
            echo "❌ One or more frontend matrix jobs failed."
            echo "Frontend result: ${{ needs.test-frontend.result }}"
            exit 1
          fi