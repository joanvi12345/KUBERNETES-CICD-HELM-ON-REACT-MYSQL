name: Automated Tests

on:
  pull_request:
    branches:
      - "**"
  workflow_call:

jobs:
  test-frontend:
    name: Frontend Tests (Jest / React Testing Library)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --watchAll=false --coverage --ci
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  test-backend:
    name: Backend Tests (Mocha / Chai)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: example
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create database password file
        run: echo -n "root" > /tmp/db-password

      - name: Run Mocha tests
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          PORT: 8081
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_DB: example
          DATABASE_USER: root
          DATABASE_PASSWORD: /tmp/db-password
