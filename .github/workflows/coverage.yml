name: Code Coverage Report

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  # ─── Job 1: Frontend coverage with Jest ─────────────────────────────────────
  coverage-frontend:
    name: Frontend Coverage (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Jest generates coverage in frontend/coverage/ when --coverage is passed.
      # --coverageReporters controls the output formats:
      #   text       → printed to the console (captured below)
      #   lcov       → industry-standard format used by most CI dashboards
      #   json-summary → machine-readable summary (used to extract the %)
      - name: Run tests with coverage
        run: |
          npm test -- \
            --watchAll=false \
            --ci \
            --coverage \
            --coverageReporters=text \
            --coverageReporters=lcov \
            --coverageReporters=json-summary
        env:
          CI: true

      # Parse coverage/coverage-summary.json and extract the line-coverage %.
      # Then write a human-readable table to $GITHUB_STEP_SUMMARY so it appears
      # on the Actions run page under the "Summary" tab.
      - name: Extract coverage and write job summary
        run: |
          SUMMARY_FILE="coverage/coverage-summary.json"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "⚠️ coverage-summary.json not found — skipping summary."
            exit 0
          fi

          # Read totals using Node (always available, no jq dependency needed)
          node - <<'EOF'
          const fs   = require("fs");
          const data = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
          const t    = data.total;

          const lines      = t.lines.pct;
          const statements = t.statements.pct;
          const functions  = t.functions.pct;
          const branches   = t.branches.pct;

          // Pick an emoji badge based on line coverage
          const badge = lines >= 80 ? "🟢" : lines >= 50 ? "🟡" : "🔴";

          const summary = [
            "## 📊 Frontend Code Coverage Report",
            "",
            `${badge} **Line Coverage: ${lines}%**`,
            "",
            "| Metric     | Coverage |",
            "|------------|----------|",
            `| Lines      | ${lines}%      |`,
            `| Statements | ${statements}%      |`,
            `| Functions  | ${functions}%      |`,
            `| Branches   | ${branches}%      |`,
            "",
            "> Coverage generated by **Jest** with `--coverageReporters=json-summary`.",
          ].join("\n");

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          console.log(`Frontend line coverage: ${lines}%`);
          EOF

      # Upload the full lcov report (HTML + data files) as a downloadable artifact.
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
          retention-days: 14

  # ─── Job 2: Backend coverage with nyc (Istanbul) ────────────────────────────
  coverage-backend:
    name: Backend Coverage (nyc / Istanbul)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # nyc is the Istanbul CLI — it instruments the code and wraps the test runner.
      # It is installed locally so it doesn't pollute the global environment.
      - name: Install nyc (Istanbul coverage tool)
        run: npm install --save-dev nyc

      # nyc wraps the mocha command and collects coverage.
      # Reporters:
      #   text         → printed to console
      #   lcov         → standard format for CI tools
      #   json-summary → parsed below to extract the %
      - name: Run tests with nyc coverage
        run: |
          npx nyc \
            --reporter=text \
            --reporter=lcov \
            --reporter=json-summary \
            --report-dir=coverage \
            npm test
        env:
          CI: true
          NODE_ENV: test
          PORT: 8081

      - name: Extract backend coverage and write job summary
        run: |
          SUMMARY_FILE="coverage/coverage-summary.json"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "⚠️ coverage-summary.json not found — skipping summary."
            exit 0
          fi

          node - <<'EOF'
          const fs   = require("fs");
          const data = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
          const t    = data.total;

          const lines      = t.lines.pct;
          const statements = t.statements.pct;
          const functions  = t.functions.pct;
          const branches   = t.branches.pct;

          const badge = lines >= 80 ? "🟢" : lines >= 50 ? "🟡" : "🔴";

          const summary = [
            "## 📊 Backend Code Coverage Report",
            "",
            `${badge} **Line Coverage: ${lines}%**`,
            "",
            "| Metric     | Coverage |",
            "|------------|----------|",
            `| Lines      | ${lines}%      |`,
            `| Statements | ${statements}%      |`,
            `| Functions  | ${functions}%      |`,
            `| Branches   | ${branches}%      |`,
            "",
            "> Coverage generated by **nyc (Istanbul)** wrapping Mocha.",
          ].join("\n");

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          console.log(`Backend line coverage: ${lines}%`);
          EOF

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage/
          retention-days: 14

  # ─── Job 3: Combined summary ─────────────────────────────────────────────────
  coverage-summary:
    name: Coverage Summary Gate
    runs-on: ubuntu-latest
    needs: [coverage-frontend, coverage-backend]
    if: always()

    steps:
      - name: Report overall status
        run: |
          echo "================================================"
          echo "  📋 Coverage Pipeline Summary"
          echo "================================================"
          echo "  Frontend : ${{ needs.coverage-frontend.result }}"
          echo "  Backend  : ${{ needs.coverage-backend.result }}"
          echo "------------------------------------------------"
          echo "  Artifacts retained for 14 days:"
          echo "  • frontend-coverage-${{ github.sha }}"
          echo "  • backend-coverage-${{ github.sha }}"
          echo ""
          echo "  View the full interactive HTML report by"
          echo "  downloading the artifact and opening"
          echo "  lcov-report/index.html in your browser."
          echo "================================================"

          # Write a combined footer to the job summary
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          ---
          ### 🗂️ Coverage Artifacts
          Both lcov HTML reports are available as downloadable artifacts on this run page.
          Download the zip, extract it, and open `lcov-report/index.html` in your browser
          for a full file-by-file interactive coverage breakdown.
          EOF
