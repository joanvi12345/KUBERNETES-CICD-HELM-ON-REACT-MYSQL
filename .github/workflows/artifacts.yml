name: Build & Upload Artifacts

on:
  workflow_call: # solo se ejecuta cuando main.yml lo llame

jobs:
  # ─── Job 1: Build the React frontend ────────────────────────────────────────
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          CI: false
          # Ensures assets use relative paths — compatible with any hosting root
          PUBLIC_URL: /KUBERNETES-CICD-HELM-ON-REACT-MYSQL

      - name: Show build output contents
        run: |
          echo "📦 Frontend build output:"
          ls -lh build/
          echo ""
          echo "Total size: $(du -sh build/ | cut -f1)"

      # Upload the entire build/ folder as a versioned artifact.
      # The artifact is kept for 7 days and can be downloaded from the
      # GitHub Actions run page or via the REST API.
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/build/
          # Fail the step if the build folder is empty
          if-no-files-found: error
          retention-days: 7

  # ─── Job 2: Package the Node/Express backend ────────────────────────────────
  build-backend:
    name: Package Backend (Node/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install production dependencies only
        # --omit=dev skips devDependencies (mocha, nodemon, etc.)
        # so the artifact is lean and production-ready
        run: npm ci --omit=dev

      - name: Create backend distribution package
        run: |
          mkdir -p dist

          # Copy only the files needed to run the backend in production
          cp -r src/           dist/src/
          cp    package.json   dist/package.json
          cp    healthcheck.js dist/healthcheck.js

          # Copy the pruned node_modules (production deps only)
          cp -r node_modules/  dist/node_modules/

          echo "📦 Backend dist contents:"
          ls -lh dist/
          echo ""
          echo "Total size: $(du -sh dist/ | cut -f1)"

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: backend/dist/
          if-no-files-found: error
          retention-days: 7

  # ─── Job 3: Bundle both artifacts into one combined archive ─────────────────
  bundle-artifacts:
    name: Create Combined Release Bundle
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download the artifacts produced by the two previous jobs
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: release/frontend/

      - name: Download backend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: release/backend/

      # Add metadata so the bundle is self-documenting
      - name: Write release metadata file
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          cat > release/BUILD_INFO.txt << EOF
          ====================================================
            Release Bundle — Build Information
          ====================================================
            Repository  : ${{ github.repository }}
            Branch      : ${{ github.ref_name }}
            Author      : ${{ github.actor }}
            Commit SHA  : ${{ github.sha }}
            Short SHA   : ${SHORT_SHA}
            Commit msg  : ${{ github.event.head_commit.message }}
            Build date  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ====================================================
          EOF
          echo "📋 BUILD_INFO.txt written:"
          cat release/BUILD_INFO.txt

      - name: Show full release bundle structure
        run: |
          echo "📁 Release bundle structure:"
          find release/ -type f | sort
          echo ""
          echo "Total size: $(du -sh release/ | cut -f1)"

      # Upload the combined bundle as a single artifact
      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Print artifact summary
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "================================================"
          echo "  ✅ Artifacts uploaded successfully"
          echo "================================================"
          echo "  frontend-build-${{ github.sha }}"
          echo "    → React production build (nginx-ready)"
          echo "    → Retained for 7 days"
          echo ""
          echo "  backend-dist-${{ github.sha }}"
          echo "    → Node/Express production package"
          echo "    → Retained for 7 days"
          echo ""
          echo "  release-bundle-${{ github.sha }}"
          echo "    → Combined frontend + backend + metadata"
          echo "    → Retained for 30 days"
          echo ""
          echo "  Download from:"
          echo "  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "================================================"
